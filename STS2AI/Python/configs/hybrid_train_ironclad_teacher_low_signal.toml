# Conservative combat-teacher sweep preset for IRONCLAD.
#
# Use this when you want to compare against a low offline-teacher influence
# profile while keeping the rest of train_hybrid.py defaults intact.

[training]
output_dir = "STS2AI/Artifacts/hybrid_training/ironclad_teacher_low_signal"

[combat_ppo]
combat_monster_reward_weight = 1.0

[offline_noncombat_ranking]
offline_noncombat_ranking_data_dir = ""
offline_noncombat_ranking_loss_weight = 0.0

[offline_combat_teacher]
offline_combat_teacher_data_dir = "STS2AI/Artifacts/combat_teacher/ironclad_act1_solver_v2_dataset_320.jsonl"
offline_combat_teacher_loss_weight = 0.1
offline_combat_teacher_batch_size = 32
offline_combat_teacher_updates_per_iter = 1
offline_combat_teacher_warmup_iters = 0
