# 单局 smoke 配置。
# 用于先验证 restore / branching / 可视化是否工作，再放大到正式数据。

[environment]
transport = "pipe-binary"
auto_launch = true
num_envs = 1
start_port = 16620

[dataset]
episodes = 1
seed_prefix = "ONCRSMOKE"
output = "STS2AI/Artifacts/offline_noncombat_ranking/cardreward_smoke"
sample_types = "card_reward"
flush_every_episodes = 1

[model]
checkpoint = ""
combat_checkpoint = ""

[labeling]
label_mode = "single_step"
rollout_goal = "terminal"
rollout_max_combats = 2
rollout_max_steps = 5000
rerun_low_spread_threshold = 0.0
rerun_max_combats = 3
rerun_max_steps = 5000

[reward_tree]
tree_max_reward_depth = 2
tree_beam_width = 2
tree_advance_max_steps = 5000
tree_local_weight = 0.7
tree_max_option_seconds = 2.0
tree_recurse_only_when_spread_below = 0.2

[limits]
episode_stop_floor = 0
local_ort_rollout = false
local_ort_max_combat_steps = 600
