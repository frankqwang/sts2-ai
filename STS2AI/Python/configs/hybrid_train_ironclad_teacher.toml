# Hybrid training config for the current IRONCLAD combat-teacher phase.
#
# How this file works:
# - Every leaf key should match a train_hybrid.py argparse dest name.
# - Sections are only for readability; nested tables are flattened.
# - Example: [combat_teacher] combat_teacher_loss_weight = 0.3
#
# Current data flow:
# - Online non-combat PPO rollouts are still the primary non-combat signal.
# - Online combat PPO / MCTS data are still the primary combat signal in hybrid.
# - Offline non-combat ranking data shapes card/shop/campfire preference.
# - Offline combat teacher data corrects combat action scoring.
# - Saved offline episodes are written for future use; they are not consumed
#   automatically during the same training run.
#
# Current intent of this profile:
# - Keep the main hybrid loop on.
# - Make combat teacher supervision matter more than the old default.
# - Avoid loading invalid deleted offline datasets.
# - Leave enough live PPO/combat PPO signal on so the model does not drift
#   too far from the playable baseline.

[environment]
pipe = true
transport = "pipe-binary"
auto_launch = true
num_envs = 4
start_port = 15527
character_id = "IRONCLAD"

[training]
max_iterations = 500
episodes_per_iter = 0
episode_timeout = 90.0
max_episode_steps = 600
output_dir = "artifacts/hybrid_training"

[ppo]
ppo_lr = 1e-4
ppo_epochs = 4
ppo_minibatch = 32
ppo_entropy_coeff = 0.1
ppo_clip = 0.2
# `boss_readiness_coeff`:
# Auxiliary loss weight for the boss-aware readiness head.
# Raising it a little helps the shared encoder care more about upcoming boss
# identity during non-combat decisions without overwhelming PPO.
boss_readiness_coeff = 0.05

[mcts]
mcts = false
mcts_sims = 50
mcts_lr = 1e-3
mcts_batch_size = 128
mcts_train_steps = 10
mcts_warmup_iters = 50
mcts_replay_size = 50000

[combat_ppo]
combat_ppo_lr = 3e-4
combat_ppo_epochs = 4
combat_ppo_minibatch = 64
combat_ppo_entropy_coeff = 0.05
combat_ppo_clip = 0.2
# `combat_monster_reward_weight`:
# Scale applied when merging hallway-combat PPO rewards.
# 1.0 means hallway fights count fully.
# 0.7 keeps hallway data, but leans a bit more toward elite/boss quality.
combat_monster_reward_weight = 0.7

[architecture]
embed_dim = 48
combat_hidden_dim = 192
# `combat_main_path_mode`:
# Structure used by the real combat rollout policy/value path.
# - "mlp": keep the legacy main combat policy/value path
# - "light_attention": add a residual state/action attention branch to the main
#   combat rollout path
#
# Important:
# - This is for the real rollout brain, not the offline teacher scorer.
# - We keep it on "mlp" by default because the first teacher-only experiment
#   was not an appropriate way to judge the main path.
# - If we test this, we should do it through train_hybrid.py A/B, not by
#   directly overwriting the main combat checkpoint with teacher-only training.
combat_main_path_mode = "mlp"
# `offline_noncombat_ranking_head_mode`:
# Structure used by the offline non-combat ranking scorer for card_reward/shop
# style option ranking.
# - "mlp": keep the legacy scorer
# - "light_attention": add a residual attention block over screen context plus
#   candidate options
#
# This does NOT replace the whole non-combat PPO trunk. It only upgrades the
# ranking head used by offline non-combat supervision.
offline_noncombat_ranking_head_mode = "mlp"
deck_repr_dim = 0

[saved_offline_episodes]
saved_offline_episodes_enabled = true
saved_offline_episodes_min_floor = 14
saved_offline_replay_traces_enabled = true
saved_offline_metrics_log_enabled = true

[offline_noncombat_ranking]
# `offline_noncombat_ranking_data_dir`:
# Empty disables the old deleted/offline ranking dataset.
# We intentionally disable it in this profile because the old default path
# pointed at invalid data and our current focus is combat improvement.
offline_noncombat_ranking_data_dir = ""
offline_noncombat_ranking_batch_size = 32
# `offline_noncombat_ranking_loss_weight`:
# Overall multiplier for matchup ranking loss.
# Left at 0.0 here because matchup is disabled in this profile.
offline_noncombat_ranking_loss_weight = 0.0
# `offline_noncombat_ranking_updates_per_iter`:
# How many separate offline matchup batches to train per hybrid iteration.
# Kept at 1 so re-enabling matchup later starts conservatively.
offline_noncombat_ranking_updates_per_iter = 1
# `offline_noncombat_ranking_warmup_iters`:
# Delay before matchup loss starts. Irrelevant while disabled, but if re-enabled
# this keeps early PPO adaptation cleaner.
offline_noncombat_ranking_warmup_iters = 100
offline_noncombat_ranking_loss_decay_tau = 0.0
offline_noncombat_ranking_blend_beta = 0.0
offline_noncombat_ranking_min_spread = 0.001

[offline_combat_teacher]
# `offline_combat_teacher_data_dir`:
# Use the best-known high-quality solver-labeled combat dataset rather than
# the old deleted `combat_teacher_post_wizardly` path.
offline_combat_teacher_data_dir = "artifacts/combat_teacher/ironclad_act1_solver_v2_dataset_320.jsonl"
# `offline_combat_teacher_loss_weight`:
# Multiplier applied to the total combat teacher loss inside hybrid.
# Old default was 0.1. We raise it to 0.2 so teacher corrections actually
# move the combat network, but still keep live combat PPO in the loop.
offline_combat_teacher_loss_weight = 0.2
# `offline_combat_teacher_batch_size`:
# Number of teacher states per update step. 64 gives a more stable gradient
# than 32 without making each iteration too slow.
offline_combat_teacher_batch_size = 64
# `offline_combat_teacher_updates_per_iter`:
# Old behavior was effectively 1 teacher batch per hybrid iteration.
# We raise it to 4 so a growing teacher dataset does not become too diluted.
offline_combat_teacher_updates_per_iter = 4
# `offline_combat_teacher_warmup_iters`:
# 0 means teacher supervision is active immediately.
offline_combat_teacher_warmup_iters = 0

[counterfactual]
counterfactual_scoring = false
counterfactual_weight = 0.0
skada_prior_weight = 0.15
skada_boss_weights = false

[kl]
kl_warmstart = false
kl_beta_start = 0.5
kl_beta_decay = 2000

[milestones]
boss_entry_quality_weight = 0.0
early_damage_potion_penalty_weight = 0.0
