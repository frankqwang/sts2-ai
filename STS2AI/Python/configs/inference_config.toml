# Canonical inference config shared by evaluate_ai.py, train_hybrid rollout,
# and the teacher data builder. Any script that drives the full-run env should
# load this and treat the values as the single source of truth for "how the
# agent plays". Previous drift (training with rerank ON but evaluating with
# rerank OFF) silently invalidated cross-ckpt comparisons.
#
# Changing a value here means every downstream script gets the new behaviour
# on the next run. Don't add new flags directly in evaluate_ai.py or train_hybrid
# without also listing them here.

[combat]
# Soft rerank over NN logits using score_combat_action_safety. Training
# rollout uses weight=1.0 (from hybrid_train_*.toml).
combat_safety_rerank = true
combat_safety_rerank_weight = 1.0

# Hard mask that force-disables obviously self-killing actions (self-damage
# cards when HP <= damage, attacks during Phase-2 boss invulnerable windows).
# Currently gated by a module-level flag in train_hybrid; mirror it here.
combat_unsafe_mask = false

# Minimal lethal-detection probe: if NN picks end_turn but lethal is possible
# this turn, override to the lethal card sequence. OFF by default so any A/B
# experiment toggling this gets clean deltas.
lethal_probe = false

# Beam search lookahead before argmax (0 disables). Legacy flag; not used in
# current runs.
beam_search = 0

# combat_turn_solver / combat_turn_planner are heavyweight search overrides.
# OFF for canonical eval; separate research tracks enable them explicitly.
combat_turn_solver = false
combat_turn_planner = false
turn_solver_mode = "boss_elite"
turn_planner_mode = "boss_elite"

# Teacher-head rerank fusion: pull action_scores from forward_teacher into
# final decision. Deploy-time way to make teacher training actually matter.
# OFF for now; Phase 3 experiment flips this on and we compare.
combat_teacher_rerank = false
combat_teacher_rerank_weight = 0.5


[noncombat]
# The rule-level auto-progress and loop-escape tracker. evaluate_ai has these
# baked into run_single_game. The teacher data builder does NOT, which is the
# proximate cause of builder runs stalling at floor 2-6 (noncombat screens get
# stuck in argmax loops). Phase 2 extracts a shared agent so all three drivers
# get the same behaviour.
auto_progress = true         # skip/confirm/claim UI prompts
loop_escape   = true         # break argmax loops with RepeatLoopTracker

# Rule-level override that picks the best card from a combat_reward screen
# based on the next-boss token. Training uses weight=0.8 (from
# hybrid_train_*.toml). Evaluation currently has no equivalent path (Phase 3
# candidate).
boss_conditioned_card_guidance = true
boss_conditioned_card_guidance_weight = 0.8


[sampling]
# For evaluation and builder: always greedy.
# For training rollout: sampling (handled separately in train_hybrid).
deterministic_policy = true


[seeds]
# Canonical eval uses the regression suite (EVAL_001..EVAL_N), falling back
# to EVAL_{i:03d} when the seed file is missing. num_games default.
seed_suite = "regression"
num_games  = 50
