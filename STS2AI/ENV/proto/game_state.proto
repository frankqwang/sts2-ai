syntax = "proto3";

package sts2ai;

option csharp_namespace = "STS2AI.Bridge";

// ============================================================
// STS2 Game Bridge Protocol
//
// C# 游戏端序列化 → Python 训练端反序列化
// 覆盖战斗和非战斗所有状态。
// ============================================================

// --- 顶层 GameState ---

message GameState {
  string state_type = 1;          // "monster"/"elite"/"boss"/"map"/"shop"/"event"/"rest_site"/"card_reward"/"game_over" ...
  bool terminal = 2;
  string run_outcome = 3;         // "victory" / "defeat" / ""
  RunInfo run = 4;
  PlayerState player = 5;
  BattleState battle = 6;         // 仅战斗时有
  MapState map = 7;               // 仅地图时有
  ShopState shop = 8;
  EventState event = 9;
  RestSiteState rest_site = 10;
  CardRewardState card_reward = 11;
  CombatRewardsState combat_rewards = 12;
  CardSelectState card_select = 13;
  RelicSelectState relic_select = 14;
  TreasureState treasure = 15;
  repeated LegalAction legal_actions = 20;
  string encounter_id = 21;
}

message RunInfo {
  int32 act = 1;
  int32 floor = 2;
}

// --- Player ---

message PlayerState {
  int32 hp = 1;
  int32 max_hp = 2;
  int32 block = 3;
  int32 gold = 4;
  int32 energy = 5;
  int32 max_energy = 6;
  int32 draw_pile_count = 7;
  int32 discard_pile_count = 8;
  int32 exhaust_pile_count = 9;
  int32 play_pile_count = 10;
  int32 open_potion_slots = 11;
  repeated CardInfo deck = 20;
  repeated RelicInfo relics = 21;
  repeated PotionInfo potions = 22;
  int32 max_potions = 23;
  int32 stars = 24;               // 战斗时玩家星数
  repeated Power powers = 30;     // 仅战斗时填充
}

message CardInfo {
  int32 index = 1;
  string id = 2;
  string name = 3;
  int32 cost = 4;
  string card_type = 5;           // "ATTACK"/"SKILL"/"POWER"/"STATUS"/"CURSE"/"QUEST"
  string rarity = 6;              // "basic"/"common"/"uncommon"/"rare"/"ancient"
  bool is_upgraded = 7;
  int32 upgrades = 8;
}

message RelicInfo {
  int32 index = 1;
  string id = 2;
  string name = 3;
  string description = 4;
}

message PotionInfo {
  int32 index = 1;
  string id = 2;
  string name = 3;
  string description = 4;
}

message Power {
  string id = 1;
  int32 amount = 2;
  string name = 3;
  string description = 4;
  repeated string keywords = 5;
}

// --- Battle ---

message BattleState {
  int32 round_number = 1;
  string turn_side = 2;            // "player" / "enemy"
  bool is_play_phase = 3;
  bool can_end_turn = 4;
  int32 energy = 5;
  int32 max_energy = 6;
  PlayerState player = 7;          // 含 powers
  repeated HandCard hand = 10;
  repeated Enemy enemies = 11;
  repeated string draw_pile_cards = 20;
  repeated string discard_pile_cards = 21;
  repeated string exhaust_pile_cards = 22;
}

message HandCard {
  int32 index = 1;
  string id = 2;
  string name = 3;
  int32 cost = 4;
  string card_type = 5;
  string rarity = 6;
  string target_type = 7;         // "None"/"Self"/"AnyEnemy"/"AllEnemies"/...
  bool is_upgraded = 8;
  bool can_play = 9;
  bool requires_target = 10;
  repeated int32 valid_target_ids = 11;
  // 2026-04-24 新增：sim 内部已经算好的真实/动态信息（考虑 buff/遗物后的效果）
  string description = 12;        // card.GetDescriptionForPile(Hand)，含当前状态修饰
  repeated string keywords = 13;  // 卡牌关键字（Attack, Ethereal 等）
  // 每个合法目标对应的实际伤害预览（含玩家力量/虚弱 + 敌人脆弱）
  map<int32, int32> preview_damage_per_target = 14;
  int32 preview_block = 15;        // 本次打出对玩家的实际 block（含敏捷/脆弱）
}

message Enemy {
  string id = 1;
  int32 combat_id = 2;
  string name = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  int32 block = 6;
  bool is_alive = 7;
  bool is_hittable = 8;
  bool intends_to_attack = 9;
  string next_move_id = 10;
  repeated Power powers = 11;
  repeated Intent intents = 12;
}

message Intent {
  string type = 1;                // "attack"/"defend"/"buff"/"debuff"/"escape"/"sleep"
  string label = 2;
  int32 damage = 3;               // 单次伤害
  int32 total_damage = 4;         // 总伤害
  int32 hits = 5;                 // 攻击次数
  string title = 6;
  string description = 7;
}

// --- Map ---

message MapState {
  repeated MapOption next_options = 1;
  repeated MapNode nodes = 2;
  MapNode boss = 3;
}

message MapOption {
  int32 index = 1;
  int32 col = 2;
  int32 row = 3;
  string point_type = 4;          // "monster"/"elite"/"boss"/"rest_site"/"shop"/"event"/"treasure"
  string label = 5;
}

message MapNode {
  int32 col = 1;
  int32 row = 2;
  string type = 3;
  repeated MapEdge children = 4;
}

message MapEdge {
  int32 col = 1;
  int32 row = 2;
}

// --- Shop ---

message ShopState {
  bool is_open = 1;
  bool can_proceed = 2;
  repeated ShopItem items = 3;
}

message ShopItem {
  int32 index = 1;
  string category = 2;            // "card"/"relic"/"potion"/"remove_card"
  int32 cost = 3;
  bool can_afford = 4;
  bool is_stocked = 5;
  bool on_sale = 6;
  string id = 7;
  string name = 8;
}

// --- Event ---

message EventState {
  string event_id = 1;
  bool in_dialogue = 2;
  bool is_finished = 3;
  repeated EventOption options = 4;
}

message EventOption {
  int32 index = 1;
  string text = 2;
  string label = 3;
  bool is_locked = 4;
  bool is_chosen = 5;
  bool is_proceed = 6;
}

// --- Rest Site ---

message RestSiteState {
  repeated RestOption options = 1;
  bool can_proceed = 2;
}

message RestOption {
  int32 index = 1;
  string id = 2;                  // "rest"/"smith"/"recall"/"dig"/"lift"/"toke"
  string name = 3;
  bool is_enabled = 4;
}

// --- Card Reward ---

message CardRewardState {
  bool can_skip = 1;
  repeated HandCard cards = 2;    // 复用 HandCard message
}

// --- Combat Rewards ---

message CombatRewardsState {
  bool can_proceed = 1;
  repeated RewardItem items = 2;
}

message RewardItem {
  int32 index = 1;
  string type = 2;                // "gold"/"potion"/"relic"/"card"
  string label = 3;
  string id = 4;
  bool claimable = 5;
}

// --- Card Select ---

message CardSelectState {
  string screen_type = 1;         // "card_select" / "hand_select" / ...
  int32 selected_count = 2;
  bool can_confirm = 3;
  bool can_cancel = 4;
  repeated HandCard cards = 5;            // 可选卡牌
  repeated HandCard selected_cards = 6;   // 已选卡牌
  string prompt = 7;              // UI 原始提示，说明这次选择要做什么
  int32 min_select = 8;
  int32 max_select = 9;
}

// --- Relic Select ---

message RelicSelectState {
  bool can_skip = 1;
  repeated RelicInfo relics = 2;
}

// --- Treasure ---

message TreasureState {
  bool can_proceed = 1;
  repeated RelicInfo relics = 2;
}

// --- Legal Actions ---

message LegalAction {
  string action = 1;              // "play_card"/"end_turn"/"choose_map_node"/...
  int32 index = 2;
  int32 card_index = 3;
  int32 target_id = 4;
  int32 col = 5;
  int32 row = 6;
  int32 slot = 7;
  string label = 8;
  string card_id = 9;
}

// --- Action settlement events ---

message SettlementEvent {
  string type = 1;                 // "card_play_started"/"damage_received"/"power_received"/...
  int32 sequence = 2;              // 当前 delta 内的顺序，从 0 开始
  int32 round_number = 3;
  string turn_side = 4;            // game enum string, lower-case

  string actor_id = 5;             // player character id / monster id
  int32 actor_combat_id = 6;       // monster combat id; player 或未知为 0
  bool actor_is_player = 7;

  string target_id = 8;            // player character id / monster id
  int32 target_combat_id = 9;      // monster combat id; player 或未知为 0
  bool target_is_player = 10;
  repeated string target_ids = 11;
  repeated int32 target_combat_ids = 12;

  string card_id = 13;             // played/drawn/discarded/exhausted/generated card id
  string source_card_id = 14;      // damage/power source card when available
  string power_id = 15;
  string potion_id = 16;
  string orb_id = 17;
  string move_id = 18;

  int32 amount_int = 19;           // block/energy/stars/summon/card count 等整数效果
  double amount_value = 20;        // power 层数等可能为 decimal 的效果
  int32 blocked_damage = 21;
  int32 unblocked_damage = 22;
  int32 total_damage = 23;
  int32 overkill_damage = 24;
  bool target_killed = 25;

  int32 energy_spent = 26;
  int32 stars_spent = 27;
  int32 card_play_index = 28;
  int32 card_play_count = 29;
  bool is_auto_play = 30;

  string description = 31;         // 游戏 CombatHistoryEntry.HumanReadableString
}

// --- gRPC Service ---

service GameBridge {
  // 获取当前 game state
  rpc GetState(Empty) returns (GameState);

  // 执行一个 action，返回新的 game state
  rpc TakeAction(ActionRequest) returns (GameState);

  // 重置环境（开新局/新战斗）
  rpc Reset(ResetRequest) returns (GameState);

  // 健康检查
  rpc Ping(Empty) returns (PingResponse);
}

message Empty {}

message ActionRequest {
  LegalAction action = 1;
}

message ResetRequest {
  string mode = 1;                // "full_run" / "combat_sandbox"
  string build_spec = 2;          // JSON string for combat sandbox builds (deprecated, combat 用 CombatResetRequest)
  string seed = 3;
}

message PingResponse {
  string version = 1;
  bool ready = 2;
}

// --- Combat training (精确构造战斗初始 state) ---

message CardSpec {
  string id = 1;
  int32 upgrade_level = 2;
}

message RelicSpec {
  string id = 1;
}

message PotionSpec {
  string id = 1;
  int32 slot = 2;
}

message BuildSpec {
  repeated CardSpec deck = 1;
  repeated RelicSpec relics = 2;
  optional int32 current_hp = 3;
  optional int32 max_hp = 4;
  optional int32 max_energy = 5;
  optional int32 gold = 6;
  repeated PotionSpec potions = 7;
  optional int32 max_potion_slots = 8;
}

message CombatResetRequest {
  string character_id = 1;        // "IRONCLAD"/"SILENT"/"DEFECT"/"WATCHER"
  string encounter_id = 2;        // 从 sim combat_catalog 获取
  int32 ascension_level = 3;
  string seed = 4;
  BuildSpec build = 5;
}

message CombatStepRequest {
  LegalAction action = 1;
}

// --- Bridge RPC envelope ---

enum BridgeMethod {
  HANDSHAKE = 0;
  RESET = 1;
  STATE = 2;
  ACT = 3;
  BATCH_ACT = 4;
  SAVE_STATE = 5;
  LOAD_STATE = 6;
  DELETE_STATE = 7;
  PERF_STATS = 8;
  RESET_PERF_STATS = 9;
  STEP_LOCAL_POLICY = 10;
  LOAD_ORT_MODEL = 11;
  RUN_COMBAT_LOCAL = 12;
  EXPORT_STATE = 13;
  IMPORT_STATE = 14;
  SKIP_COMBAT = 15;
  SEARCH_COMBAT_MCTS = 16;
  COMBAT_RESET = 17;
  COMBAT_ACT = 18;
  COMBAT_STATE = 19;
  SAVE_SEARCH_STATE = 20;
}

enum BridgeStatus {
  OK = 0;
  REJECTED_ACTION = 1;
  SIMULATOR_ERROR = 2;
  PROTOCOL_ERROR = 3;
  UNSUPPORTED_BACKEND = 4;
}

message BridgeHandshake {
  uint32 protocol_version = 1;
  string build_git_sha = 2;
  string schema_id = 3;
}

message BridgeResetPayload {
  string character_id = 1;
  string seed = 2;
  int32 ascension_level = 3;
  string build_json = 4;
}

message BridgeActionPayload {
  LegalAction action = 1;
}

message BridgeBatchActionPayload {
  repeated LegalAction actions = 1;
}

message BridgeStateIdRequest {
  string state_id = 1;
}

message BridgePathRequest {
  string path = 1;
}

message BridgeExportStateRequest {
  string path = 1;
  string state_id = 2;
}

message BridgeDeleteStateRequest {
  bool clear_all = 1;
  string state_id = 2;
}

message BridgeLoadOrtModelRequest {
  string path = 1;
}

message BridgeRunCombatLocalRequest {
  int32 max_steps = 1;
}

message BridgeSearchCombatMctsRequest {
  int32 num_simulations = 1;
  float c_puct = 2;
  float dirichlet_alpha = 3;
  float dirichlet_fraction = 4;
  int32 max_step_budget = 5;
  string final_action_mode = 6;
  int32 final_action_top_k = 7;
  float final_action_q_weight = 8;
  bool use_continuation_value = 9;
  bool enable_debug_trace = 10;
}

message BridgeRequestEnvelope {
  BridgeMethod method = 1;
  oneof payload {
    BridgeResetPayload reset = 2;
    BridgeActionPayload act = 3;
    BridgeBatchActionPayload batch_act = 4;
    BridgeExportStateRequest export_state = 5;
    BridgeStateIdRequest load_state = 6;
    BridgePathRequest import_state = 7;
    BridgeDeleteStateRequest delete_state = 8;
    BridgeLoadOrtModelRequest load_ort_model = 9;
    BridgeRunCombatLocalRequest run_combat_local = 10;
    BridgeSearchCombatMctsRequest search_combat_mcts = 11;
    CombatResetRequest combat_reset = 12;
    CombatStepRequest combat_act = 13;
  }
}

message BridgeError {
  string error_code = 1;
  string error_message = 2;
}

message BridgeStatePayload {
  GameState state = 1;
}

message BridgeActPayload {
  bool accepted = 1;
  string error = 2;
  GameState state = 3;
  repeated SettlementEvent settlement_events = 4;
}

message BridgeBatchActPayload {
  bool accepted = 1;
  int32 steps_executed = 2;
  string error = 3;
  GameState state = 4;
  repeated SettlementEvent settlement_events = 5;
}

message BridgeSaveStateResult {
  string state_id = 1;
  int32 cache_size = 2;
}

message BridgeExportStateResult {
  string path = 1;
  int32 cache_size = 2;
}

message BridgeDeleteStateResult {
  bool deleted = 1;
  int32 cache_size = 2;
}

message BridgePerfStatsResult {
  string json_payload = 1;
}

message BridgeResetPerfStatsResult {
  bool reset = 1;
}

message BridgeLoadOrtModelResult {
  bool loaded = 1;
  bool has_value_output = 2;
  bool has_deck_inputs = 3;
  bool has_continuation_output = 4;
  bool has_extra_scalars_input = 5;
  string execution_provider_name = 6;
  string requested_device = 7;
  bool fell_back_to_cpu = 8;
}

message BridgeRunCombatLocalResult {
  int32 combat_steps = 1;
  float elapsed_ms = 2;
  float get_snapshot_ms = 3;
  float ort_ms = 4;
  float step_async_ms = 5;
  float wait_async_ms = 6;
  float max_step_ms = 7;
  float max_wait_ms = 8;
  GameState state = 9;
}

message BridgeSearchCombatMctsResult {
  int32 action_index = 1;
  repeated int32 visit_counts = 2;
  repeated float visit_probs = 3;
  repeated float q_values = 4;
  repeated float priors = 5;
  float root_value = 6;
  float search_ms = 7;
  bool restored_ok = 8;
  int32 snapshot_count = 9;
  int32 simulation_count = 10;
  int32 save_state_count = 11;
  int32 load_state_count = 12;
  int32 delete_state_count = 13;
  int32 step_count = 14;
  int32 advance_state_count = 15;
  int32 eval_call_count = 16;
  int32 eval_batch_count = 17;
  int32 eval_state_count = 18;
  int32 select_child_count = 19;
  int32 backprop_count = 20;
  float save_state_ms = 21;
  float load_state_ms = 22;
  float delete_state_ms = 23;
  float step_ms = 24;
  float advance_state_ms = 25;
  float eval_ms = 26;
  float selection_ms = 27;
  float backprop_ms = 28;
  string debug_trace_json = 29;
}

message BridgeResponseEnvelope {
  BridgeMethod method = 1;
  BridgeStatus status = 2;
  oneof payload {
    BridgeHandshake handshake = 3;
    BridgeStatePayload state = 4;
    BridgeActPayload act = 5;
    BridgeBatchActPayload batch_act = 6;
    BridgeSaveStateResult save_state = 7;
    BridgeExportStateResult export_state = 8;
    BridgeDeleteStateResult delete_state = 9;
    BridgePerfStatsResult perf_stats = 10;
    BridgeResetPerfStatsResult reset_perf_stats = 11;
    BridgeLoadOrtModelResult load_ort_model = 12;
    BridgeRunCombatLocalResult run_combat_local = 13;
    BridgeSearchCombatMctsResult search_combat_mcts = 14;
    BridgeError error = 15;
  }
}
