# 铁甲战斗教师阶段的混合训练配置。
#
# 本文件工作方式：
# - 每个叶键应匹配 train_hybrid.py argparse 的 dest 名称。
# - 分节仅为可读性；嵌套表会被展平。
# - 例：[combat_teacher] combat_teacher_loss_weight = 0.3
#
# 当前数据流：
# - 在线非战斗 PPO rollout 仍然是主要的非战斗信号。
# - 在线战斗 PPO / MCTS 数据仍然是混合训练中主要的战斗信号。
# - 离线非战斗排序数据塑形卡牌/商店/篝火偏好。
# - 离线战斗教师数据纠正战斗动作评分。
# - 保存的离线 episode 写入磁盘供将来使用；它们不会在同一次训练运行中
#   被自动消费。
#
# 本配置的当前意图：
# - 保持主混合循环开启。
# - 让战斗教师监督比旧默认值更有影响力。
# - 避免加载已删除的无效离线数据集。
# - 保留足够的实时 PPO/战斗 PPO 信号，使模型不会偏离可玩基线太远。

[environment]
pipe = true
transport = "pipe-binary"
auto_launch = true
num_envs = 4
start_port = 15527
character_id = "IRONCLAD"

[training]
max_iterations = 500
episodes_per_iter = 0
episode_timeout = 90.0
max_episode_steps = 600
output_dir = "STS2AI/Artifacts/hybrid_training"

[ppo]
ppo_lr = 1e-4
ppo_epochs = 4
ppo_minibatch = 32
ppo_entropy_coeff = 0.1
ppo_clip = 0.2
# `boss_readiness_coeff`：
# Boss 感知就绪度辅助头的 loss 权重。
# 稍微提高可以让共享编码器在非战斗决策时更关注即将面对的 boss 身份，
# 同时不会压倒 PPO。
boss_readiness_coeff = 0.05

[mcts]
mcts = false
mcts_sims = 50
mcts_lr = 1e-3
mcts_batch_size = 128
mcts_train_steps = 10
mcts_warmup_iters = 50
mcts_replay_size = 50000

[combat_ppo]
combat_ppo_lr = 3e-4
combat_ppo_epochs = 4
combat_ppo_minibatch = 64
combat_ppo_entropy_coeff = 0.05
combat_ppo_clip = 0.2
# `combat_monster_reward_weight`：
# 合并走廊战斗 PPO 奖励时的缩放系数。
# 1.0 意味着走廊战完全计入。
# 0.7 保留走廊数据，但稍微偏向精英/boss 质量。
combat_monster_reward_weight = 0.7

[architecture]
embed_dim = 48
combat_hidden_dim = 192
# `combat_main_path_mode`：
# 真实战斗 rollout 策略/价值路径使用的结构。
# - "mlp"：保留传统主战斗策略/价值路径
# - "light_attention"：在主战斗 rollout 路径上添加残差状态/动作注意力分支
#
# 重要说明：
# - 这是给真实 rollout 脑用的，不是离线教师评分器。
# - 默认保持 "mlp"，因为第一次仅教师实验不适合用来判断主路径。
# - 如果要测试，应通过 train_hybrid.py A/B 来做，而不是直接用
#   仅教师训练覆盖主战斗 checkpoint。
combat_main_path_mode = "mlp"
# `offline_noncombat_ranking_head_mode`：
# 离线非战斗排序评分器用于卡牌奖励/商店风格选项排序的结构。
# - "mlp"：保留传统评分器
# - "light_attention"：在屏幕上下文加候选选项之上添加残差注意力块
#
# 这不会替换整个非战斗 PPO 主干。它只升级离线非战斗监督使用的
# 排序头。
offline_noncombat_ranking_head_mode = "mlp"
deck_repr_dim = 0

[saved_offline_episodes]
saved_offline_episodes_enabled = true
saved_offline_episodes_min_floor = 14
saved_offline_replay_traces_enabled = true
saved_offline_metrics_log_enabled = true

[offline_noncombat_ranking]
# `offline_noncombat_ranking_data_dir`：
# 留空以禁用已删除的旧离线排序数据集。
# 在本配置中故意禁用，因为旧默认路径指向无效数据，
# 且当前重点是战斗改进。
offline_noncombat_ranking_data_dir = ""
offline_noncombat_ranking_batch_size = 32
# `offline_noncombat_ranking_loss_weight`：
# 匹配排序 loss 的整体乘数。
# 这里设为 0.0 因为本配置禁用了匹配排序。
offline_noncombat_ranking_loss_weight = 0.0
# `offline_noncombat_ranking_updates_per_iter`：
# 每个混合迭代训练多少个独立的离线匹配排序 batch。
# 保持 1 以便后续重新启用时从保守值开始。
offline_noncombat_ranking_updates_per_iter = 1
# `offline_noncombat_ranking_warmup_iters`：
# 匹配排序 loss 开始前的延迟。禁用时无关紧要，但如果重新启用，
# 可以让早期 PPO 适应更干净。
offline_noncombat_ranking_warmup_iters = 100
offline_noncombat_ranking_loss_decay_tau = 0.0
offline_noncombat_ranking_blend_beta = 0.0
offline_noncombat_ranking_min_spread = 0.001

[offline_combat_teacher]
# `offline_combat_teacher_data_dir`：
# 使用已知最好的高质量求解器标注战斗数据集，
# 而非旧的已删除 `combat_teacher_post_wizardly` 路径。
offline_combat_teacher_data_dir = "STS2AI/Artifacts/combat_teacher/ironclad_act1_solver_v2_dataset_320.jsonl"
# `offline_combat_teacher_loss_weight`：
# 混合训练中战斗教师总 loss 的乘数。
# 旧默认值是 0.1。提高到 0.2 以使教师纠正能真正推动战斗网络，
# 但仍保留实时战斗 PPO 在循环中。
offline_combat_teacher_loss_weight = 0.2
# `offline_combat_teacher_batch_size`：
# 每次更新步骤的教师状态数。64 比 32 给出更稳定的梯度，
# 同时不会使每个迭代太慢。
offline_combat_teacher_batch_size = 64
# `offline_combat_teacher_updates_per_iter`：
# 旧行为实际上是每个混合迭代 1 个教师 batch。
# 提高到 4 以免增长的教师数据集被稀释太多。
offline_combat_teacher_updates_per_iter = 4
# `offline_combat_teacher_warmup_iters`：
# 0 表示教师监督立即生效。
offline_combat_teacher_warmup_iters = 0

[counterfactual]
counterfactual_scoring = false
counterfactual_weight = 0.0
skada_prior_weight = 0.15
skada_boss_weights = false

[kl]
kl_warmstart = false
kl_beta_start = 0.5
kl_beta_decay = 2000

[milestones]
boss_entry_quality_weight = 0.0
early_damage_potion_penalty_weight = 0.0
